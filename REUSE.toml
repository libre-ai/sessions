version = 1

# First-party software by default: the Rust application workspace, the local
# development environment, the packaging and verification scripts, the
# end-to-end suite and the supply-chain configuration. Locations are enumerated
# instead of globbed from the root, so a new top-level artefact class stays
# deliberately uncovered until it is reviewed. More permissive boundaries are
# declared below; the last matching annotation wins within this file.
[[annotations]]
path = [
  ".cargo/**",
  ".env.example",
  ".gitignore",
  "Cargo.lock",
  "Cargo.toml",
  "crates/**",
  "deny.toml",
  "dev/**",
  "e2e/**",
  "scripts/**",
]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Libre AI contributors"
SPDX-License-Identifier = "EUPL-1.2"

# Editorial documentation and first-party project records: specifications,
# decision records, plans, readiness cockpits, and the evidence and handoff
# payloads kept alongside them under `docs/`.
[[annotations]]
path = ["*.md", "**/*.md", "LICENSE", "docs/**"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Libre AI contributors"
SPDX-License-Identifier = "CC-BY-4.0"

# Interoperability contracts and their synthetic fixtures. These files describe
# a token shape and a client-facing projection so that other implementations can
# map onto the same vocabulary; they exist to be re-implemented, and carry the
# permissive grant with its explicit patent clause.
[[annotations]]
path = ["docs/contracts/**"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Libre AI contributors"
SPDX-License-Identifier = "Apache-2.0"

# Executable policy and first-party workflows stay reciprocal.
# `docs/db/jobs-manifest.json` declares the tenant column, the database roles
# and the per-table data classification enforced by the database inspection
# gate: it is runtime policy, not merely an interoperability contract, and not
# an editorial record.
[[annotations]]
path = [".github/**", "docs/db/**"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Libre AI contributors"
SPDX-License-Identifier = "EUPL-1.2"

# Design-system assets generated by the first-party `portal-forge` build and
# copied here as UI fixtures and as the crate's own token and theme sheets.
# Their provenance (builder repository, revision and per-file digests) is
# recorded in `manifest.json`. No third-party font binary is tracked in this
# repository: the CSS only names font families.
#
# These assets are the "client-facing design/web packages and application
# templates" line of the canonical policy, so they carry the permissive grant
# rather than the reciprocal default that surrounds them. The same emission is
# redistributed by sibling repositories of the organisation, where it is already
# published under `Apache-2.0`: `tokens.css` and `contrast-report.json` are
# byte-identical across those copies. Declaring them reciprocal here would not
# produce reciprocity — a recipient simply takes the permissive copy — it would
# only misstate the grant offered on these bytes.
#
# `crates/ui/src/tokens.css` and `crates/ui/src/themes.css` are the same emitted
# artefacts: their digests are the ones recorded in `manifest.json` for
# `tokens/tokens.css` and `tokens/themes.css`. They are annotated here instead
# of falling through to the `crates/**` default, so that one artefact does not
# carry two grants inside a single repository. `crates/ui/src/components.css`
# and `crates/ui/src/portal-bridge.css` are first-party sheets written in this
# repository — they are not forge output and stay reciprocal.
[[annotations]]
path = [
  "crates/ui/fixtures/portal/**",
  "crates/ui/src/themes.css",
  "crates/ui/src/tokens.css",
]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Libre AI contributors"
SPDX-License-Identifier = "Apache-2.0"
