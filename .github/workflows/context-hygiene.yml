name: Context hygiene

# Hard-fail invariants over the tracked tree, all evaluated from `git ls-files`.
#
# Blocks private identifiers and machine-local paths from entering the public
# tree. Deny patterns are stored base64-encoded so this workflow never carries
# them in human-readable form (obfuscation, not encryption: the goal is zero
# readable mention, plus grep-proof compliance of the tree). Text files only
# (-I): identifiers embedded in binary files would escape these checks. Lines
# carrying the 'allow-local-path' marker are exempt from the path check.
#
# The duplicate-contents step is hosted here rather than in a workflow of its
# own for one reason: only two checks are required on `main`, and a check
# delivered in a new workflow would not be one of them — it could go red on a
# pull request that merges anyway, which is a decoration, not a gate. This job
# already is a required check and already reasons over the same file listing,
# so a new tree-level invariant belongs in it.
#
# The job's `name` is deliberately the category ("tracked tree hygiene"), not an
# enumeration of the controls below. That name is the exact string branch
# protection matches on, so it is configuration living outside this repository:
# every rename costs a coordinated protection update, and a PR carrying the
# rename cannot report the old name. Naming the category means adding a control
# never forces that manoeuvre. Do not narrow it back to a list of steps, and do
# not change it to track what the steps happen to check today.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  context-hygiene:
    name: Tracked tree hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Banned private identifiers (hard fail)
        run: |
          set -euo pipefail
          banned="$(printf '%s' 'W2Rdb3hhbGxpYQ==' | base64 -d)"
          if git grep -I -n -i -E -e "$banned" -- .; then
            echo "::error::Banned private identifier found in tracked files."
            exit 1
          fi
          echo "OK: no banned identifier in tracked files."

      - name: Machine-local identifiers and paths (hard fail)
        run: |
          set -euo pipefail
          generic='/Users/[A-Za-z0-9._-]+' # allow-local-path (pattern definition)
          user_pat="$(printf '%s' 'W2ldZmk2NTY3' | base64 -d)"
          hits="$(git grep -I -n -E -e "$generic" -e "$user_pat" -- . \
            | grep -v 'allow-local-path' || true)"
          if [ -n "$hits" ]; then
            printf '%s\n' "$hits"
            echo "::error::Machine-local identifier or path found in tracked files."
            exit 1
          fi
          echo "OK: no machine-local identifier or path in tracked files."

      - name: Symlink targets (hard fail)
        run: |
          set -euo pipefail
          banned="$(printf '%s' 'W2Rdb3hhbGxpYQ==' | base64 -d)"
          user_pat="$(printf '%s' 'W2ldZmk2NTY3' | base64 -d)"
          hits=""
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            t="$(readlink "$f" || true)"
            if printf '%s' "$t" | grep -qiE -e "$banned" -e "$user_pat" -e '/Users/'; then
              hits="${hits}${f} -> ${t} ; "
            fi
          done < <(git ls-files -s | awk -F'\t' '$1 ~ /^120000/ {print $2}')
          if [ -n "$hits" ]; then
            printf '%s\n' "$hits"
            echo "::error::Symlink target carries a machine-local or private identifier."
            exit 1
          fi
          echo "OK: no offending symlink target."

      - name: Duplicate file contents (hard fail)
        run: ./scripts/check-duplicate-contents.sh
