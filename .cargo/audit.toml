# cargo-audit config — mirrors deny.toml's advisory policy so the two agree.
#
# Neither gate currently runs in CI: the workflows that invoked them
# (`ci.yml`, `security.yml`) were retired with the legacy product CI when this
# repository became a reserved shell. Both configs are kept accurate against the
# locked graph so that reactivation is a workflow change and not an archaeology
# exercise — but the claim "enforced in CI" is not true today and is no longer
# made here. `scripts/check-advisory-waivers.sh`, wired into the required
# tracked-tree hygiene job, is what actually holds these two files to the graph
# in the meantime.
#
# Every entry below carries a machine-checked trailing marker:
#     # waiver: crate=<name> expires=<YYYY-MM-DD>
# An entry that is undated, past its expiry, or names a crate absent from
# `Cargo.lock` fails that check. cargo-audit's ignore list is a plain array of
# strings, so a trailing comment is the only place an expiry can live.
[advisories]
ignore = [
    # proc-macro-error2 is unmaintained (informational; not a vulnerability, and
    # no patched version exists). It reaches the tree only as a build-time
    # proc-macro dependency of biscuit-quote -> biscuit-auth, so it contributes
    # no code to the shipped binary. The exit is upstream: biscuit-auth dropping
    # it. Revisit at the expiry rather than renewing silently.
    "RUSTSEC-2026-0173", # waiver: crate=proc-macro-error2 expires=2027-01-31
]

# Removed 2026-07-26 — RUSTSEC-2023-0071 (rsa, Marvin Attack).
#
# The entry justified itself with "pulled in via jsonwebtoken's rust_crypto
# backend for RS256". That backend is not the one configured:
# `crates/server/Cargo.toml` pins jsonwebtoken with
# `default-features = false, features = ["aws_lc_rs", "use_pem"]`, and
# `rust_crypto` appeared nowhere in this repository except in that comment.
# `rsa` is absent from `Cargo.lock` — `cargo tree --edges normal -i rsa` matches
# no package — so the waiver suppressed nothing, while standing ready to
# suppress the advisory for real if `rsa` ever returned by another path.
# deny.toml already carried the correct account; this file had not caught up.
