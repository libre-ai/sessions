# Supply-chain gate (evolution Sec2). Enforces ADR-0001's OSS-only licensing
# (MIT/Apache/MPL and equivalently-permissive) and fails on known vulnerabilities.
# Unlisted licenses are denied: a transitive AGPL/SSPL/GPL dependency breaks CI.

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MPL-2.0",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "CC0-1.0",
    "BSL-1.0",              # Boost Software License (permissive — NOT Business Source)
    "CDLA-Permissive-2.0", # permissive data license
]
# The `allow` list above is the INBOUND policy for third-party dependencies and
# is unchanged. The first-party workspace crates are OUTBOUND `EUPL-1.2` (see
# LICENSING at https://github.com/libre-ai/libre-ai/blob/main/LICENSING.md), so
# they are named one by one here instead of widening the inbound allow-list:
# a third-party EUPL dependency must still be reviewed explicitly.
exceptions = [
    { allow = ["EUPL-1.2"], crate = "presto-core" },
    { allow = ["EUPL-1.2"], crate = "presto-rag" },
    { allow = ["EUPL-1.2"], crate = "presto-server" },
    { allow = ["EUPL-1.2"], crate = "rumble-lm-app" },
    { allow = ["EUPL-1.2"], crate = "rumble-lm-join" },
    { allow = ["EUPL-1.2"], crate = "rumble-lm-ui" },
]
confidence-threshold = 0.9

[advisories]
yanked = "deny"
# Vulnerabilities block the gate. This single entry acknowledges an *unmaintained*
# (not vulnerable) transitive macro dep; remove once an upstream dep drops it.
# OIDC JWT verification uses the AWS-LC backend, so the vulnerable `rsa` crate
# and its former RUSTSEC-2023-0071 waiver are absent from the locked graph.
#
# Each entry carries a machine-checked trailing marker,
#     # waiver: crate=<name> expires=<YYYY-MM-DD>
# verified by `scripts/check-advisory-waivers.sh` in the required tracked-tree
# hygiene job: undated, expired, or naming a crate absent from `Cargo.lock` is a
# hard fail. The marker is a comment because cargo-deny 0.19 accepts only `id`
# and `reason` in a structured ignore entry and rejects an `expiration` key.
ignore = [
    "RUSTSEC-2026-0173", # waiver: crate=proc-macro-error2 expires=2027-01-31
]

[bans]
# Duplicate versions are a hygiene concern, not a gate failure for a young tree.
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
    "https://github.com/libre-ai/context-kit", # ADR-0045: extracted Context Kit crates
]
