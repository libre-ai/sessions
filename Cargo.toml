[workspace]
resolver = "3"
members = [
  "crates/app",
  "crates/core",
  "crates/gear-loader",
  "crates/gear-memory",
  "crates/join",
  "crates/rag",
  "crates/server",
  "crates/ui",
]

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "EUPL-1.2"
repository = "https://github.com/libre-ai/sessions"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
presto-core = { path = "crates/core" }
presto-rag = { path = "crates/rag" }
rumble-lm-ui = { path = "crates/ui" }
dioxus = { version = "0.7", default-features = false, features = ["macro", "html", "signals", "hooks", "launch"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
time = { version = "0.3", features = ["serde", "formatting", "macros"] }
# Vendored from `libre-ai/context-kit` (deleted upstream) — see
# docs/adr/0006-vendor-gear-crates.md. These were `git`+`rev` dependencies until
# the source repository disappeared, which made the workspace unbuildable from a
# clean checkout. `gear-memory` no longer needs `default-features = false`: the
# `sqlite` feature it was suppressing does not exist here any more.
gear-loader = { path = "crates/gear-loader" }
gear-memory = { path = "crates/gear-memory" }

[profile.release]
strip = true
lto = "thin"
